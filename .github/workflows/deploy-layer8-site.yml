name: Deploy Layer8Culture Site

on:
  workflow_dispatch:
    inputs:
      confirm_full_site_artifact:
        description: "Type DEPLOY to confirm the complete site artifact and verified backup."
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm complete-site deployment
        env:
          CONFIRM: ${{ inputs.confirm_full_site_artifact }}
        run: |
          test "$CONFIRM" = "DEPLOY"
          git fetch --depth=1 origin b7423550086bbfadd38a98b71e96ff3060fc27f8
          python scripts/validate_site_artifact.py

      - name: Check deployment token
        id: token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LAYER8CULTURE }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN_LAYER8CULTURE is missing. Deployment refused."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy static guides
        if: steps.token.outputs.enabled == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LAYER8CULTURE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site
          output_location: ""
          skip_app_build: true
