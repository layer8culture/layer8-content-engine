name: Deploy Layer8Culture Site

on:
  workflow_dispatch:
    inputs:
      confirm_full_site_artifact:
        description: "Type DEPLOY to confirm the complete site artifact and verified backup."
        required: true
        type: string
      deployment_target:
        description: "Deploy to the existing preview environment first, or the production default."
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm complete-site deployment
        env:
          CONFIRM: ${{ inputs.confirm_full_site_artifact }}
        run: |
          test "$CONFIRM" = "DEPLOY"
          git fetch --depth=1 origin b7423550086bbfadd38a98b71e96ff3060fc27f8
          python scripts/build_projects_showcase.py
          python scripts/build_homepage_refinement.py
          python -m unittest tests.test_visual_guides tests.test_projects_showcase tests.test_homepage_refinement
          python scripts/validate_site_artifact.py

      - name: Check deployment token
        id: token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LAYER8CULTURE }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN_LAYER8CULTURE is missing. Deployment refused."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy verified complete site
        if: steps.token.outputs.enabled == 'true'
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LAYER8CULTURE }}
          DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
        run: |
          npx --yes --package '@azure/static-web-apps-cli@2.0.7' \
            swa deploy site --swa-config-location site \
            --env "$DEPLOYMENT_TARGET" --no-use-keychain
