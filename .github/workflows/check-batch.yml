name: Check batch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  batch-readiness:
    name: Batch readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media inspection dependencies
        run: |
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate changed batch payloads at the exact PR head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/batch_readiness.py --static --changed-from "$BASE_SHA"
