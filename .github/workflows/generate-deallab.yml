name: Generate Deal Lab Content

on:
  # Deal Lab content generation is paused intentionally.
  # Keep manual dispatch available only for an explicit future restart.
  workflow_dispatch:
    inputs:
      date:
        description: "Eastern target date (YYYY-MM-DD); blank uses Eastern today"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  generate-deallab:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve intended batch date once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          RUN_CREATED_AT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)"
          python scripts/generation_date.py --lane deallab \
            --event "$RUN_EVENT" --run-created-at "$RUN_CREATED_AT" \
            --date "$INPUT_DATE" --github-env "$GITHUB_ENV"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Generate Deal Lab posts with Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          copilot -p "$(cat clients/therealestatedeallab/generation-prompt.md)"$'\n\n'"$GENERATION_TARGET_INSTRUCTION" \
            -s \
            --allow-tool='read,write(queue/*)' \
            --no-ask-user

      - name: Verify queue file was written
        run: |
          if [ ! -f "$QUEUE_FILE" ]; then
            echo "::error::Copilot CLI did not write $QUEUE_FILE."
            echo "queue/ currently contains:"
            ls -la queue/ || true
            exit 1
          fi
          echo "Confirmed $QUEUE_FILE was written ($(wc -c < "$QUEUE_FILE") bytes)."
          python scripts/queue_json_guard.py "$QUEUE_FILE" --repair

      - name: Assign and validate posting schedule
        run: |
          python scripts/schedule_planner.py "$QUEUE_FILE" --date "$BATCH_DATE"
          python scripts/schedule_planner.py "$QUEUE_FILE" --for-publish --date "$BATCH_DATE"

      - name: Generate visuals via OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_IMAGE_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_IMAGE_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
          OPENAI_IMAGE_2K: ${{ vars.OPENAI_IMAGE_2K }}
          OPENAI_IMAGE_LONG_EDGE: ${{ vars.OPENAI_IMAGE_LONG_EDGE }}
        run: |
          pip install openai requests pillow
          echo "Generating images for $QUEUE_FILE"
          python scripts/openai_gen.py "$QUEUE_FILE"

      - name: Gate approval PR on schema, schedule, and final media
        run: |
          python scripts/queue_json_guard.py "$QUEUE_FILE"
          python scripts/schedule_planner.py "$QUEUE_FILE" --for-publish --date "$BATCH_DATE"
          python scripts/batch_readiness.py "$QUEUE_FILE"

      - name: Open approval PR
        env:
          GH_TOKEN: ${{ secrets.ENGINE_PR_TOKEN }}
        run: |
          DATE="$BATCH_DATE"
          BRANCH="deallab/posts-$DATE-${GITHUB_RUN_ID}"
          git config user.name "layer8-engine"
          git config user.email "engine@layer8culture.io"
          git checkout -b "$BRANCH"
          git add queue/
          git add -f assets/generated
          git commit -m "Deal Lab posts for $DATE - ready for review"
          git push origin "$BRANCH"
          SHA=$(git rev-parse HEAD)
          python scripts/build_pr_preview.py "$QUEUE_FILE" \
                 --repo "${{ github.repository }}" \
                 --sha "$SHA" \
                 --brand "TheRealEstateDealLab" \
                 --out pr-body.md
          gh pr create --title "Deal Lab posts for $DATE" \
                       --body-file pr-body.md \
                       --base main --head "$BRANCH"
